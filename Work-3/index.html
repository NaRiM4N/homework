<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Практика по формам</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <form>
      <fieldset>
        <h2>Ваши личные данные</h2>
        <label>
          Ваше имя
          <input
            class="input-1"
            type="text"
            placeholder="Имя"
            name="name"
            required
          />
        </label>
        <label>
          Ваш возраст
          <input
            class="input-1"
            type="number"
            placeholder="Возраст"
            name="age"
            required
          />
        </label>
        <label>
          Ваш номер телефона
          <input
            class="input-1"
            type="tel"
            placeholder="Номер телефона"
            name="phone"
            required
          />
        </label>
        <label>
          Ваша почта
          <input
            class="input-1"
            type="email"
            placeholder="Почта"
            name="mail"
            required
          />
        </label>
        <label>
          Сообщение
          <textarea
            name="message"
            placeholder="Ваше сообщение"
            required
          ></textarea>
        </label>
        <label>
          <input
            class="input-2"
            type="checkbox"
            name="rules"
            value="rules"
            required
          />
          Я принимаю правила
        </label>
        <button type="submit">Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
